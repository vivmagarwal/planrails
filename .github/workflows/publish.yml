# Publishes a tagged version to npm through trusted publishing (OIDC).
#
# No npm token exists anywhere: the job proves its identity to npm with a short-lived
# OpenID token that GitHub mints for this workflow, npm accepts a publish from this one
# workflow of this one repository, and provenance is attached automatically (public
# repository, public package). The one-time setup on npmjs.com is in CONTRIBUTING.md
# § Release. Trigger: `npm version patch && git push --follow-tags`.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a short-lived publish credential
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build
      - run: npm install -g npm@12 # trusted publishing needs npm 11.5.1 or later; pin the major
      - run: npm ci
      - run: npm test
      - run: npm run selftest
      # prepublishOnly runs scripts/release-check.mjs before: the tag must match package.json,
      # the version must not exist yet, the CHANGELOG must have its entry, the tree must be clean.
      # postpublish runs it after: it waits until the registry serves the version.
      - run: npm publish
