# Tests the checker on every OS and supported Node. No install: there are no
# dependencies. Windows is in the matrix on purpose — the old package could not
# run there, and this proves the rebuild does.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tools/check-plans.test.mjs
      - run: node tools/check-plans.mjs --root examples/weekly-digest
