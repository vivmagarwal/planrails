name: Edge case
description: The gate was wrong in a case nobody thought of — it passed work that was not done, or failed work that was.
labels: ["edge-case"]
body:
  - type: textarea
    id: the-case
    attributes:
      label: The case
      description: What was true about the task, and what the checker said about it. Say what it literally computed and what was actually true.
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Which way was it wrong
      options:
        - the checker PASSED a task that was not really done
        - the checker FAILED a task that was really done
        - the planner method led me to a bad plan
        - something else
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What should have happened
    validations:
      required: true
